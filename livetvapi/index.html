<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamX Live TV API Player</title>
    <!-- Shaka Player CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0d14; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { margin-bottom: 6px; color: #00ff88; font-size: 22px; }
        p.subtitle { color: #8892b0; font-size: 13px; margin-bottom: 18px; }
        
        .player-container {
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            border: 1px solid #1f2438;
        }
        video {
            width: 100%;
            height: 480px;
            display: block;
            background: #000;
        }
        .controls {
            padding: 16px;
            background: #131722;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #1f2438;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        select {
            padding: 10px 14px;
            background: #1c2233;
            color: #fff;
            border: 1px solid #2e3852;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        select:focus { border-color: #00ff88; }
        #catSelect { width: 180px; }
        #chSelect { flex: 1; min-width: 220px; }

        #nowPlaying {
            font-size: 13px;
            color: #00ff88;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats {
            margin-top: 16px;
            font-size: 12px;
            color: #556285;
        }
        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #252e47;
            color: #00ff88;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>📺 StreamX Universal Live TV API Player</h1>
    <p class="subtitle">Direct Playback with Auto-Token, ClearKey DRM & BaseURL Resolver</p>

    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
        <div class="controls">
            <div class="row">
                <select id="catSelect" onchange="onCategoryChange()">
                    <option value="All">All Categories</option>
                </select>

                <select id="chSelect" onchange="onChannelChange()">
                    <option value="">Loading channels from API...</option>
                </select>
            </div>

            <div id="nowPlaying">Connecting to Live TV API...</div>
        </div>
    </div>

    <div class="stats" id="stats">Channels Loaded: 0</div>

    <script>
        let allChannels = [];
        let player = null;
        let activeJioCookie = '';

        async function fetchLatestCookie() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/sportlive18/playlist/refs/heads/main/cookie.json');
                const list = await res.json();
                if (Array.isArray(list) && list[1] && list[1].cookie) {
                    activeJioCookie = list[1].cookie;
                    console.log('Got latest Jio token cookie:', activeJioCookie);
                }
            } catch(e) {
                console.warn('Could not fetch auto-cookie:', e.message);
            }
        }

        async function init() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                alert('Browser not supported for DASH/HLS playback');
                return;
            }

            const video = document.getElementById('video');
            player = new shaka.Player(video);

            player.addEventListener('error', (e) => {
                console.error('Shaka Playback Error:', e.detail);
                document.getElementById('nowPlaying').innerHTML = `⚠️ Playback error (${e.detail ? e.detail.code : 'Stream offline'}).`;
            });

            // Register Request Filter
            player.getNetworkingEngine().registerRequestFilter((type, req) => {
                let u = req.uris[0];
                if (!u) return;

                // Fix double-slashes
                if (u.includes('.jio.com//')) {
                    u = u.replace(/\.jio\.com\/+bpk-tv\//, '.jio.com/bpk-tv/');
                }

                // Attach Jio Token
                const isJio = u.includes('jio.com') || u.includes('jiocinema') || (u.includes('bpk-tv') && u.includes('akamaized.net'));
                if (isJio && activeJioCookie) {
                    const tokenVal = activeJioCookie.replace(/^__hdnea__=/, '').replace(/^hdnea=/, '');
                    if (u.includes('__hdnea__=')) {
                        u = u.replace(/(__hdnea__=)[^&"'\s;]+/, '$1' + tokenVal);
                    } else {
                        u += (u.includes('?') ? '&' : '?') + '__hdnea__=' + tokenVal;
                    }
                    req.uris[0] = u;
                }

                // If running on local server and URL is from Astro or non-open CDN, proxy it
                if (window.location.protocol.startsWith('http') && (u.includes('astro.com.my') || u.includes('akamaized.net'))) {
                    if (!u.includes('/api/proxy?url=')) {
                        req.uris[0] = '/api/proxy?url=' + encodeURIComponent(u);
                    }
                }
            });

            fetchLatestCookie();

            try {
                const isHttp = window.location.protocol.startsWith('http');
                const apiURL = isHttp ? 'channels.json' : 'https://cdn.jsdelivr.net/gh/HackingNaruto/Api@main/livetvapi/channels.json';
                const res = await fetch(apiURL);
                const data = await res.json();
                allChannels = data.channels || [];
                
                document.getElementById('stats').innerText = `Total Channels: ${data.total_channels} | Categories: ${data.categories.length}`;
                
                const catSelect = document.getElementById('catSelect');
                data.categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    catSelect.appendChild(opt);
                });

                if (data.categories.includes('Tamil')) {
                    catSelect.value = 'Tamil';
                } else if (data.categories.includes('Sony LIV')) {
                    catSelect.value = 'Sony LIV';
                }
                onCategoryChange();

            } catch (err) {
                console.error(err);
                document.getElementById('nowPlaying').innerText = 'API Fetch Failed. Check internet connection.';
            }
        }

        function onCategoryChange() {
            const cat = document.getElementById('catSelect').value;
            const chSelect = document.getElementById('chSelect');
            chSelect.innerHTML = '';

            const filtered = (cat === 'All') 
                ? allChannels 
                : allChannels.filter(c => c.category === cat);

            filtered.forEach((c) => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = `${c.name} ${c.drm ? '🔒 [DRM]' : ''}`;
                chSelect.appendChild(opt);
            });

            if (filtered.length > 0) {
                playChannelById(filtered[0].id);
            }
        }

        function onChannelChange() {
            const id = document.getElementById('chSelect').value;
            playChannelById(id);
        }

        async function playChannelById(id) {
            const ch = allChannels.find(c => c.id === id);
            if (!ch) return;

            document.getElementById('nowPlaying').innerHTML = `▶ Now Playing: <b>${ch.name}</b> <span class="badge">${ch.category}</span> ${ch.drm ? '<span class="badge">DRM Decrypted</span>' : ''}`;

            const config = {
                drm: {},
                manifest: {
                    dash: { ignoreMinBufferTime: true }
                },
                streaming: {
                    bufferingGoal: 10,
                    rebufferingGoal: 2,
                    lowLatencyMode: true
                }
            };
            if (ch.drm && ch.drm.clearKeys) {
                config.drm.clearKeys = ch.drm.clearKeys;
            }
            player.configure(config);

            try {
                let streamUrl = ch.url;
                // If it's an external Astro or CDN stream on local server, proxy the manifest
                if (window.location.protocol.startsWith('http') && (streamUrl.includes('astro.com.my') || streamUrl.includes('akamaized.net'))) {
                    streamUrl = '/api/proxy?url=' + encodeURIComponent(streamUrl);
                }
                await player.load(streamUrl);
                console.log('Successfully loaded stream:', ch.name);
            } catch (err) {
                console.warn('Load attempt failed:', err);
                if (ch.fallback_urls && ch.fallback_urls.length > 0) {
                    try {
                        console.log('Trying fallback URL for:', ch.name);
                        let fbUrl = ch.fallback_urls[0];
                        if (window.location.protocol.startsWith('http') && (fbUrl.includes('astro.com.my') || fbUrl.includes('akamaized.net'))) {
                            fbUrl = '/api/proxy?url=' + encodeURIComponent(fbUrl);
                        }
                        await player.load(fbUrl);
                        return;
                    } catch(fbErr) {
                        console.warn('Fallback also failed:', fbErr);
                    }
                }
                document.getElementById('nowPlaying').innerHTML = `⚠️ Failed to play ${ch.name} (Offline or restricted).`;
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
